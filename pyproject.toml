[project]
name = "keireki"
version = "0.1.0"
description = "Generate Japanese rirekisho and shokumukeirekisho PDFs from structured YAML."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    { name = "Jonas Höckert" },
]
dependencies = [
    "jinja2>=3.1.4",
    "pydantic>=2.8.2",
    "pyyaml>=6.0.2",
    "rich>=13.7.1",
    "typer>=0.12.3",
    "weasyprint>=62.3",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business",
]

[project.scripts]
keireki = "keireki.cli:app"

[dependency-groups]
dev = [
    "mypy>=1.11.1",
    "pytest>=8.3.2",
    "ruff>=0.5.7",
    "types-PyYAML>=6.0.12.20240917",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["keireki"]

[[tool.mypy.overrides]]
module = ["weasyprint.*"]
ignore_missing_imports = true
